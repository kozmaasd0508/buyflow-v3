name: Purchase Resolution Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Purchase resolution dry run
        run: npm exec --workspace @buyflow/api -- tsx src/scripts/purchase-resolution-dry-run.ts
        env:
          SUPABASE_URL: https://acjenqkrvnkdvvgordry.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
