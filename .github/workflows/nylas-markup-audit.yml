name: Nylas Structured Markup Read-only Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Nylas structured markup read-only audit
        run: npm run nylas:markup-audit --workspace @buyflow/api
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash
