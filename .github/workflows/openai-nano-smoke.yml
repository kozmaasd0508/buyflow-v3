name: GPT-5.4 Nano Read-only Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: GPT-5.4 nano read-only smoke
        run: npm run openai:nano-smoke --workspace @buyflow/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-nano
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash
