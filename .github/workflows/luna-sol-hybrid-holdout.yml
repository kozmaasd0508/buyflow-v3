name: Luna Sol Hybrid REAL30 Holdout

on:
  push:
    branches:
      - test/luna-sol-hybrid-holdout
    paths:
      - apps/api/src/scripts/mail-lens-real30-hybrid-holdout.ts
      - .github/workflows/luna-sol-hybrid-holdout.yml
      - apps/api/src/ai/**
      - apps/api/src/email/**

permissions:
  contents: read

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api
      - name: Selective Luna-Sol REAL30 holdout
        run: npx tsx apps/api/src/scripts/mail-lens-real30-hybrid-holdout.ts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
