name: V7 Luna V2 Purchase Creation Corroboration 300

on:
  push:
    branches: [codex/v7-luna-prompt-v2]

jobs:
  v7-luna-v2-purchase-creation-corroboration-300:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API regression suite
        run: npm test --workspace @buyflow/api

      - name: Prepare anonymized blocked order-created audit
        run: python .github/scripts/v7_order_created_audit_patch.py

      - name: Expand audit population from 100 to 300 emails
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          v5 = Path('apps/api/src/scripts/phase-e-100-real-lifecycle-v5-scoped.ts')
          source = v5.read_text()
          old = '.slice(0, 100);'
          if old not in source:
              raise SystemExit('order_audit_300_v5_anchor_missing')
          v5.write_text(source.replace(old, '.slice(0, 300);', 1))

          v7 = Path('apps/api/src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid.ts')
          source = v7.read_text()
          old = '    || baseline.discoveredMessages !== 100'
          if old not in source:
              raise SystemExit('order_audit_300_v7_anchor_missing')
          v7.write_text(source.replace(old, '    || baseline.discoveredMessages !== 300', 1))
          PY

      - name: Run 300-email Luna benchmark and blocked order-created audit
        run: npm exec --workspace @buyflow/api -- tsx src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid-runner-fix.ts
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          V7_ORDER_CREATED_AUDIT_LIMIT: '100'
