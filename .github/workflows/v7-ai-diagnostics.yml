name: V7 Luna V2 Unlinked Audit 50

on:
  push:
    branches: [codex/v7-luna-prompt-v2]

jobs:
  v7-luna-v2-unlinked-audit-50:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: Prepare anonymized 100-email UNLINKED audit
        run: python .github/scripts/v7_unlinked_audit_patch.py

      - name: Run 50-case anonymized UNLINKED audit
        run: npm exec --workspace @buyflow/api -- tsx src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid-runner-fix.ts
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          V7_UNLINKED_AUDIT_LIMIT: '50'
