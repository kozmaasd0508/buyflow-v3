name: V7 Luna V2 Purchase Journey Context 300

# benchmark: structured-html + trusted lifecycle memory + conservative safety baseline
# cache-seed: absolute workspace path + domain-separated encryption
# replay-proof: cached run must perform zero new AI/provider calls
# replay-check: deferred identity shadow integration
# deferred-measurement: preserve legacy score lanes and add separate recovery safety metrics
# opportunity-audit: classify future hard-id and namespace wake-up potential without logging identifiers
# opportunity-audit-replay: validate anonymous wake-up categories from encrypted cache
# [benchmark] seeds/reuses encrypted private corpus + AI extraction cache.
# [replay] requires those encrypted caches and performs 0 new AI/provider calls.
on:
  push:
    branches: [codex/v7-luna-prompt-v2]

concurrency:
  group: v7-luna-v2-purchase-journey-context-300
  cancel-in-progress: true

jobs:
  v7-luna-v2-purchase-journey-context-300:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API regression suite
        run: npm test --workspace @buyflow/api

      - name: Validate deferred recovery benchmark patch
        run: python .github/scripts/v7_deferred_recovery_benchmark_patch.py --check

      - name: Validate deferred opportunity audit compile patch
        run: python .github/scripts/v7_deferred_recovery_audit_compile_patch.py --check

      - name: Prepare encrypted benchmark cache directory
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: mkdir -p "${{ github.workspace }}/.cache/v7-private-benchmark"

      - name: Restore encrypted private benchmark cache
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/v7-private-benchmark
          key: v7-private-benchmark-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            v7-private-benchmark-v1-${{ runner.os }}-

      - name: Prepare anonymized blocked order-created audit
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: python .github/scripts/v7_order_created_audit_patch.py

      - name: Add trusted lifecycle event memory
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: python .github/scripts/v7_journey_event_memory_patch.py

      - name: Expand audit population from 100 to 300 emails
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          v5 = Path('apps/api/src/scripts/phase-e-100-real-lifecycle-v5-scoped.ts')
          source = v5.read_text()
          old = '.slice(0, 100);'
          if old not in source:
              raise SystemExit('order_audit_300_v5_anchor_missing')
          v5.write_text(source.replace(old, '.slice(0, 300);', 1))

          v7 = Path('apps/api/src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid.ts')
          source = v7.read_text()
          old = '    || baseline.discoveredMessages !== 100'
          if old not in source:
              raise SystemExit('order_audit_300_v7_anchor_missing')
          v7.write_text(source.replace(old, '    || baseline.discoveredMessages !== 300', 1))
          PY

      - name: Enable encrypted frozen corpus and fast replay
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: python .github/scripts/v7_fast_replay_patch.py

      - name: Enable deferred recovery benchmark lane
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: python .github/scripts/v7_deferred_recovery_benchmark_patch.py

      - name: Enable deferred opportunity audit compile fix
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: python .github/scripts/v7_deferred_recovery_audit_compile_patch.py

      - name: Run 300-email Luna benchmark or cached replay
        if: contains(github.event.head_commit.message, '[benchmark]') || contains(github.event.head_commit.message, '[replay]')
        run: npm exec --workspace @buyflow/api -- tsx src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid-runner-fix.ts
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          V7_BENCHMARK_CACHE_KEY: ${{ secrets.V7_BENCHMARK_CACHE_KEY }}
          V7_BENCHMARK_CACHE_DIR: ${{ github.workspace }}/.cache/v7-private-benchmark
          V7_BENCHMARK_REPLAY_ONLY: ${{ contains(github.event.head_commit.message, '[replay]') && '1' || '0' }}
          V7_ORDER_CREATED_AUDIT_LIMIT: '100'
