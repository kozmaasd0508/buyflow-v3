name: Send Password Reset Once

on:
  push:
    paths:
      - '.github/workflows/send-password-reset-once.yml'

permissions:
  contents: read

jobs:
  send-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Send reset email to the permanent BuyFlow user
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = 'https://acjenqkrvnkdvvgordry.supabase.co';
          const publishableKey = 'sb_publishable_aFkSa0y3YHzgBAxRx3nwxg_o5_8shFp';
          const resetUrl = 'https://buyflow-v3-api-dev.onrender.com/auth/reset-password';
          const secret = process.env.SUPABASE_SECRET_KEY;
          if (!secret) throw new Error('Missing Supabase server credential');

          const admin = createClient(url, secret, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });
          const { data, error } = await admin.auth.admin.listUsers({ page: 1, perPage: 1000 });
          if (error) throw new Error('Could not list BuyFlow users');

          const users = data.users.filter((user) =>
            !user.email?.startsWith('buyflow-auth-smoke-') &&
            user.user_metadata?.purpose !== 'buyflow_auth_api_smoke'
          );
          if (users.length !== 1 || !users[0].email) {
            throw new Error('Expected exactly one permanent BuyFlow user');
          }

          const client = createClient(url, publishableKey, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });
          const { error: resetError } = await client.auth.resetPasswordForEmail(users[0].email, {
            redirectTo: resetUrl,
          });
          if (resetError) {
            throw new Error(`Password reset request failed: ${resetError.message}`);
          }

          console.log('Password reset email requested successfully; no email address or token was printed.');
          NODE
