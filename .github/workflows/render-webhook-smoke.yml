name: Render Webhook Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Wait for Render deployment and verify health
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 20 "$URL/health" 2>/dev/null || true)"
            if echo "$body" | grep -q '"version":"0.3.2"'; then
              echo "Render health is on v0.3.2"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "Render did not expose v0.3.2 in time"
              exit 1
            fi
            sleep 10
          done

      - name: Wait for BuyFlow browser preview
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/app/"
          for attempt in $(seq 1 30); do
            body="$(curl -fsS --max-time 20 "$URL" 2>/dev/null || true)"
            if echo "$body" | grep -q '<title>BuyFlow</title>' && echo "$body" | grep -q 'id="app"'; then
              echo "BuyFlow browser preview is live"
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "BuyFlow browser preview did not become available in time"
              exit 1
            fi
            sleep 10
          done

      - name: Verify password reset page
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/auth/reset-password"
          body="$(curl -fsS --max-time 20 "$URL")"
          echo "$body" | grep -q 'Új jelszó beállítása'
          echo "$body" | grep -q 'Jelszó mentése'
          echo "Password reset page passed"

      - name: Verify app API requires login
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/api/me"
          code="$(curl -sS -o /tmp/api-auth-check.txt -w '%{http_code}' --max-time 20 "$URL")"
          if [ "$code" != "401" ]; then
            echo "Expected 401 without login token, got $code"
            exit 1
          fi
          echo "App API authentication guard passed"

      - name: Verify mobile CORS allowlist
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/api/purchases"

          allowed_code="$(curl -sS -D /tmp/cors-allowed.txt -o /dev/null -w '%{http_code}' \
            --max-time 20 \
            -X OPTIONS \
            -H 'Origin: https://localhost' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            "$URL")"
          if [ "$allowed_code" != "204" ]; then
            echo "Expected 204 for trusted mobile preflight, got $allowed_code"
            exit 1
          fi
          grep -qi '^access-control-allow-origin: https://localhost' /tmp/cors-allowed.txt
          grep -qi '^access-control-allow-headers:.*Authorization' /tmp/cors-allowed.txt

          curl -sS -D /tmp/cors-blocked.txt -o /dev/null --max-time 20 \
            -H 'Origin: https://not-buyflow.example' \
            "https://buyflow-v3-api-dev.onrender.com/api/me"
          if grep -qi '^access-control-allow-origin:' /tmp/cors-blocked.txt; then
            echo "Untrusted origin unexpectedly received CORS permission"
            exit 1
          fi
          echo "Mobile CORS allowlist passed"

      - name: Verify Nylas challenge handshake
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/webhooks/nylas?challenge=buyflow-webhook-smoke"
          body="$(curl -fsS --max-time 20 "$URL")"
          test "$body" = "buyflow-webhook-smoke"
          echo "Nylas challenge handshake passed"

      - name: Verify webhook secret enforcement
        shell: bash
        run: |
          set -euo pipefail
          URL="https://buyflow-v3-api-dev.onrender.com/webhooks/nylas"
          code="$(curl -sS -o /tmp/nylas-secret-check.txt -w '%{http_code}' \
            --max-time 20 \
            -H 'content-type: application/json' \
            -X POST \
            --data '{"type":"message.created","data":{"object":{"id":"buyflow-invalid-signature-smoke"}}}' \
            "$URL")"
          if [ "$code" != "401" ]; then
            echo "Expected 401 for unsigned webhook, got $code"
            exit 1
          fi
          echo "Nylas webhook secret enforcement passed"
