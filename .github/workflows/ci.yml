name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API tests
        run: npm test --workspace @buyflow/api

      - name: API build
        run: npm run build --workspace @buyflow/api

      - name: Mobile typecheck
        run: npm run typecheck --workspace @buyflow/mobile

      - name: Mobile web build
        run: npm run build --workspace @buyflow/mobile

      - name: Phase E2 read-only 100-message blind
        run: npm run phase-e2:live-blind --workspace @buyflow/api
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
