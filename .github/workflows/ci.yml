name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: EventMind V11 runtime syntax
        run: python3 -m py_compile scripts/eventmind-v11-runtime.py

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API tests
        run: npm test --workspace @buyflow/api

      - name: API build
        run: npm run build --workspace @buyflow/api

      - name: Mobile typecheck
        run: npm run typecheck --workspace @buyflow/mobile

      - name: Mobile web build
        run: npm run build --workspace @buyflow/mobile
