name: CI

# V7 benchmark diagnostic branch trigger only; do not merge this CI-only change.
on:
  push:
    branches: [main, codex/v7-ai-diagnostics-run]
  pull_request:
    branches: [main]

jobs:
  phase-e-v7-ai-hybrid-shadow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: Phase E 100 lifecycle V7 Luna-Sol hybrid shadow benchmark
        run: npm exec --workspace @buyflow/api -- tsx src/scripts/phase-e-100-real-lifecycle-v7-ai-hybrid-runner-fix.ts
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
