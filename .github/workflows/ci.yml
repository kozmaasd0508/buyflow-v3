name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API tests
        run: npm test --workspace @buyflow/api

      - name: API build
        run: npm run build --workspace @buyflow/api

      - name: Mobile typecheck
        run: npm run typecheck --workspace @buyflow/mobile

      - name: Mobile web build
        run: npm run build --workspace @buyflow/mobile

      - name: Live unknown-merchant generic commerce audit (one-off, read-only)
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/unknown-merchant-live-audit-oneoff'
        env:
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_URL: https://acjenqkrvnkdvvgordry.supabase.co
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: newer_than:730d -in:spam -in:trash
          GENERIC_COMMERCE_AUDIT_MAX_MESSAGES: '10000'
        run: |
          set -euo pipefail
          DB_KEY="${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}"
          if [ -z "${NYLAS_API_KEY:-}" ] || [ -z "$DB_KEY" ]; then
            echo '{"mode":"read_only_generic_commerce_unknown_merchant_audit","status":"skipped_missing_runtime_secrets"}'
            exit 0
          fi

          RESPONSE="$(curl -fsS \
            "$SUPABASE_URL/rest/v1/email_connections?provider=eq.nylas&status=eq.active&select=provider_account_id,connected_at&order=connected_at.asc&limit=1" \
            -H "apikey: $DB_KEY")"

          GRANT_ID="$(node -e 'const rows=JSON.parse(process.argv[1]); const id=rows?.[0]?.provider_account_id; if (!id) process.exit(2); process.stdout.write(id);' "$RESPONSE")"
          echo "::add-mask::$GRANT_ID"
          export NYLAS_SMOKE_GRANT_ID="$GRANT_ID"

          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then unset SUPABASE_SERVICE_ROLE_KEY; fi
          if [ -z "${SUPABASE_SECRET_KEY:-}" ]; then unset SUPABASE_SECRET_KEY; fi

          # Audit-only transport hardening: keep candidate logic unchanged while
          # allowing the existing exponential retry to survive transient Nylas 502/503/504 responses.
          perl -0pi -e 's/statusCodeOf\(error\) !== 429/![429, 502, 503, 504].includes(statusCodeOf(error) ?? 0)/' \
            apps/api/src/scripts/nylas-generic-commerce-audit.ts
          grep -F '![429, 502, 503, 504].includes(statusCodeOf(error) ?? 0)' \
            apps/api/src/scripts/nylas-generic-commerce-audit.ts >/dev/null

          # Audit-only deterministic HMAC key. This keeps raw sender domains out of
          # logs while making the privacy fingerprint reproducible for manual Gmail review.
          perl -0pi -e "s/const key = env\.NYLAS_WEBHOOK_SECRET \?\? PROCESS_LOCAL_FINGERPRINT_SECRET;/const key = 'buyflow-audit-lookup-v1';/" \
            apps/api/src/protocols/generic-commerce-shadow.ts
          grep -F "const key = 'buyflow-audit-lookup-v1';" \
            apps/api/src/protocols/generic-commerce-shadow.ts >/dev/null

          npm run nylas:generic-commerce-audit --workspace @buyflow/api
