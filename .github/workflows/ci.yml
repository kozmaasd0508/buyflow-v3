name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-and-mobile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: API typecheck
        run: npm run typecheck --workspace @buyflow/api

      - name: API tests
        run: npm test --workspace @buyflow/api

      - name: API build
        run: npm run build --workspace @buyflow/api

      - name: Mobile typecheck
        run: npm run typecheck --workspace @buyflow/mobile

      - name: Mobile web build
        run: npm run build --workspace @buyflow/mobile

  commerce-database-permissions:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: buyflow_permissions_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify client writes are denied and backend access is preserved
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: buyflow_permissions_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/client-commerce-grants.sql
      - name: Verify extraction crash recovery and stale worker fencing
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: ci-only-password
          PGDATABASE: buyflow_permissions_test
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/source-extraction-leases.sql


  gpt6-readonly-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/gpt6-luna-sol-eval-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: GPT-6 Luna read-only live smoke
        run: npm run openai:nano-smoke --workspace @buyflow/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: gpt-6-luna
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash

      - name: GPT-6 Sol read-only live smoke
        run: npm run openai:nano-smoke --workspace @buyflow/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: gpt-6-sol
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash

      - name: GPT-5.6 Luna read-only live smoke
        run: npm run openai:nano-smoke --workspace @buyflow/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: gpt-5.6-luna
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash

      - name: GPT-5.6 Sol read-only live smoke
        run: npm run openai:nano-smoke --workspace @buyflow/api
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_SMOKE_MODEL: gpt-5.6-sol
          NYLAS_API_KEY: ${{ secrets.NYLAS_API_KEY }}
          NYLAS_SMOKE_GRANT_ID: ${{ secrets.NYLAS_GRANT_ID }}
          NYLAS_API_URI: https://api.eu.nylas.com
          EMAIL_DISCOVERY_QUERY: category:purchases newer_than:30d -in:spam -in:trash
