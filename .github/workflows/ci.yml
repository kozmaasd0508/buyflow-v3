name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  openai-shadow-secret-check:
    runs-on: ubuntu-latest
    steps:
      - name: OpenAI shadow secret availability
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node -e "console.log('OPENAI_SHADOW_SECRET ' + JSON.stringify({present:Boolean(process.env.OPENAI_API_KEY)}))"
